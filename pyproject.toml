[project.urls]
homepage = "https://github.com/huggingface/lerobot"
issues = "https://github.com/huggingface/lerobot/issues"
discord = "https://discord.gg/s3KuuzsPFb"

[project]
name = "lerobot"
version = "0.1.0"
description = "GreenVLAv1.1 whole-body policy inference for the Green Challenge simulator"
authors = [
    { name = "Rémi Cadène", email = "re.cadene@gmail.com" },
    { name = "Simon Alibert", email = "alibert.sim@gmail.com" },
    { name = "Alexander Soare", email = "alexander.soare159@gmail.com" },
    { name = "Quentin Gallouédec", email = "quentin.gallouedec@ec-lyon.fr" },
    { name = "Adil Zouitine", email = "adilzouitinegm@gmail.com" },
    { name = "Thomas Wolf", email = "thomaswolfcontact@gmail.com" },
    { name = "Steven Palma", email = "imstevenpmwork@ieee.org" },
]
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
keywords = ["robotics", "deep learning", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    # Python 3.11 / Linux x86_64 runtime. PyTorch pins its matching NVIDIA libraries.
    "accelerate==1.13.0",
    "annotated-doc==0.0.5",
    "annotated-types==0.8.0",
    "antlr4-python3-runtime==4.9.3",
    "anyio==4.14.2",
    "boto3==1.38.1",
    "botocore==1.38.46",
    "certifi==2026.7.22",
    "click==8.5.0",
    "docstring-parser==0.18.0",
    "draccus==0.11.5",
    "einops==0.8.2",
    "etils==1.12.2",
    "filelock==3.32.4",
    "fsspec==2026.6.0",
    "h11==0.16.0",
    "hf-xet==1.6.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "huggingface-hub==1.29.0",
    "hydra-core==1.3.2",
    "idna==3.19",
    "importlib-resources==6.5.2",
    "iniconfig==2.3.0",
    "jinja2==3.1.6",
    "jmespath==1.1.0",
    "markdown-it-py==4.2.0",
    "markupsafe==3.0.3",
    "mdurl==0.1.2",
    "mergedeep==1.3.4",
    "mpmath==1.3.0",
    "msgpack==1.2.1",
    "mypy-extensions==1.1.0",
    "networkx==3.6.1",
    "ninja==1.13.2",
    "numpy==2.4.6",
    "numpydantic==1.6.8",
    "omegaconf==2.3.1",
    "opencv-python-headless==5.0.0.93",
    "packaging==26.3",
    "pillow==12.3.0",
    "pluggy==1.6.0",
    "psutil==7.2.2",
    "pydantic==2.10.6",
    "pydantic-core==2.27.2",
    "pygments==2.21.0",
    "python-dateutil==2.9.0.post0",
    "pyyaml==6.0.3",
    "pyyaml-include==1.4.1",
    "regex==2026.7.19",
    "rich==15.0.0",
    "s3transfer==0.12.0",
    "safetensors==0.5.3",
    "scipy==1.15.3",
    "setuptools==84.0.0",
    "shellingham==1.5.4",
    "shtab==1.12.0",
    "six==1.17.0",
    "sympy==1.14.0",
    "tokenizers==0.22.2",
    "toml==0.10.2",
    "torch==2.7.1+cu128",
    "torchcodec==0.4.0",
    "torchvision==0.22.1+cu128",
    "tqdm==4.70.0",
    "transformers==5.5.4",
    "triton==3.3.1",
    "typeguard==4.6.0",
    "typer==0.27.1",
    "typing-extensions==4.16.0",
    "typing-inspect==0.9.0",
    "tyro==0.9.19",
    "urllib3==2.7.0",
    "websockets==17.0.1",
    "wheel==0.48.0",
