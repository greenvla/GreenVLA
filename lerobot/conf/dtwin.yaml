_target_: lerobot.common.datasets.data_config.LeRobotHumanoidS0S1DataConfig

# Runtime-only twin of the training data contract for the digital-twin checkpoint
# (run postnikov_qwen35_08b_dtwin_v102_filtered_step1_..._2026-09-02_retry1). Dataset
# files and sampling weights are intentionally absent; inference needs only the exact
# transforms and the normalization statistics embedded in the checkpoint.
#
# Every value below is copied from that checkpoint's own
# training_state/composed_hydra_config.json -> robotics_dataset. Do not guess these:
# the checkpoint carries the config it was trained under, so read it.

# The embodiment identifier the checkpoint was trained under. It is tokenized into the
# prompt (`<|embodiment_name_start|>...<|embodiment_name_end|>`), so it is part of the
# checkpoint's contract, not a label: renaming it changes the actions the model returns.
# This is the training `name` verbatim -- no "_runtime" suffix, because the model never
# saw one.
name: dtwin_v102_filtered_s0s1_step1_state_action_episode_task
# Folder name of the statistics inside the checkpoint (checkpoint/norm_stats/<asset_id>).
# Training wrote them under the longer assets id
# `dtwin_v102_filtered_s0s1_step1_state_action`; the released checkpoint republishes them
# under the dataset repo_id, which is what ships and therefore what the runtime asks for.
asset_id: dtwin_v102
repo_id: dtwin_v102
root_dir: null
sample_weights_file: null

action_sequence_keys: [action]
action_horizon: 50
action_offset: 0
# step1, not step3: this checkpoint predicts one row per control step, so the output
# contract interpolates 50 model rows into 50 rows rather than 150. Visible in the
# statistics too -- the delta-action std is about half of Track27's, which is what a
# three-times-shorter step between consecutive actions looks like.
action_sample_step: 1
control_mode: joint
smooth_actions: true
has_velocities: true

map_to_closed_kinematic: true
input_kinematic_space: open
model_kinematic_space: closed

# Training set return_subtasks/prompt_from_subtask, which only choose which dataset
# column feeds the prompt during training. At inference the prompt arrives on the wire
# and the repack transform is not used, so the runtime twin keeps them off -- same as
# the Track27 twin, whose training config sets them too.
return_subtasks: false
return_subtasks_mode: disabled
prompt_from_subtask: false
exclude_negative_subtasks: false

base_config:
  _target_: lerobot.common.datasets.data_config.DataConfig
  local_files_only: true
